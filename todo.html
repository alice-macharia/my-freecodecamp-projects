<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <ul class="todo-list">

    <li>
      <input type="checkbox" id="html">
      <label for="html">Learn HTML</label>

      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://www.freecodecamp.org/learn/" target="_blank">
            Practice HTML
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="css">
      <label for="css">Learn CSS</label>

      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/CSS" target="_blank">
            Explore CSS
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="javascript">
      <label for="javascript">Learn JavaScript</label>

      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/JavaScript" target="_blank">
            Study JavaScript
          </a>
        </li>
      </ul>
    </li>

    <li>
      <input type="checkbox" id="projects">
      <label for="projects">Build Projects</label>

      <ul class="sub-item">
        <li>
          <a class="sub-item-link" href="https://github.com/" target="_blank">
            Create a GitHub Project
          </a>
        </li>
      </ul>
    </li>

  </ul>

</body>
</html>
